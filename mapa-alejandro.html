<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conquistas de Alejandro Magno · 334–323 a.C.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#4A2540;--purple:#6B3A6B;--gold:#e6c068;--gold-deep:#C9A24B;
    --sea:#9fb8b0;--land:#e3d2a6;--ink:#3a2a1a;--ink-soft:#5c4326;
    --route:#ffcf6b;--frame:#7a5a2e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(135deg,#241b12,#352818);
    font-family:'EB Garamond',Georgia,serif;color:#e8dcc0;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:14px}
  .wrap{width:100%;max-width:1180px}
  .titlebar{text-align:center;margin-bottom:12px;color:var(--gold)}
  .titlebar h1{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.06em;
    font-size:clamp(1.05rem,3.4vw,2rem);text-shadow:0 2px 6px rgba(0,0,0,.6);line-height:1.1}
  .titlebar .sub{font-family:'Cinzel',serif;letter-spacing:.2em;
    font-size:clamp(.55rem,1.7vw,.85rem);color:var(--gold-deep);margin-top:3px;opacity:.9}

  .map-frame{position:relative;border-radius:6px;padding:9px;
    background:repeating-linear-gradient(45deg,#5a4220 0 6px,#6e5026 6px 12px);
    box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 0 0 2px #3a2a14}
  .map-inner{position:relative;border:2px solid #3a2a14;border-radius:3px;overflow:hidden}
  svg.map{display:block;width:100%;height:auto;touch-action:none}

  .sea-label{font-family:'EB Garamond',serif;font-style:italic;fill:#5e7269;font-weight:500}
  .region{font-family:'Cinzel',serif;fill:var(--ink-soft);font-weight:600;letter-spacing:.05em}

  .route-line{fill:none;stroke:var(--route);stroke-width:3.2;stroke-linecap:round;
    stroke-linejoin:round;filter:url(#glow)}
  .route-core{fill:none;stroke:#fff5da;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .runner{fill:#fff;filter:url(#glow);opacity:0}
  .runner.on{opacity:1}

  .battle{cursor:pointer}
  .battle .star{fill:var(--gold);stroke:#7a5410;stroke-width:.7;
    filter:drop-shadow(0 0 4px rgba(255,200,90,.9));transform-origin:center;
    transition:transform .25s ease;opacity:0}
  .battle.on .star{opacity:1}
  .battle:hover .star,.battle:focus-visible .star{transform:scale(1.25)}
  .battle:focus-visible{outline:none}
  .battle .pulse{fill:none;stroke:var(--gold);stroke-width:1.2;opacity:0}
  .battle.on .pulse{animation:pulse 2.6s ease-out infinite}
  @keyframes pulse{0%{r:4;opacity:.8}70%{opacity:0}100%{r:16;opacity:0}}
  .battle .lab{font-family:'Cinzel',serif;font-weight:600;fill:var(--ink);text-anchor:middle;opacity:0;transition:opacity .4s}
  .battle .lab .yr{font-family:'EB Garamond',serif;fill:var(--ink-soft)}
  .battle.on .lab{opacity:1}
  .city{opacity:0;transition:opacity .5s}.city.on{opacity:1}
  .city circle{fill:var(--ink-soft)}
  .city text{font-family:'EB Garamond',serif;font-style:italic;fill:var(--ink-soft);text-anchor:middle}

  .pop{position:absolute;z-index:30;max-width:240px;width:62vw;
    background:linear-gradient(180deg,#f3e6c4,#e3cd9e);color:var(--ink);
    border:2px solid var(--frame);border-radius:6px;padding:12px 14px;
    box-shadow:0 12px 34px rgba(0,0,0,.55);opacity:0;pointer-events:none;
    transform:translateY(6px) scale(.97);transition:opacity .18s,transform .18s}
  .pop.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
  .pop h3{font-family:'Cinzel',serif;font-size:.95rem;color:var(--purple-deep);margin-bottom:5px}
  .pop .yr{font-family:'Cinzel',serif;font-size:.7rem;color:var(--gold-deep);letter-spacing:.1em;margin-bottom:8px}
  .pop .row{font-size:.83rem;line-height:1.4;margin-bottom:3px}
  .pop .row i{color:#6a5638;font-style:italic}.pop .row b{color:var(--purple-deep)}
  .pop .close{position:absolute;top:5px;right:9px;border:none;background:none;font-size:1.2rem;color:#6a5638;cursor:pointer;line-height:1}
  .pop .close:hover{color:var(--purple-deep)}

  .controls{margin-top:13px;background:linear-gradient(180deg,#e9d8b0,#d6bd8a);
    border:2px solid var(--frame);border-radius:6px;padding:13px 15px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);color:var(--ink)}
  .ctl-row{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .playbtn{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.06em;
    background:var(--purple-deep);color:var(--gold);border:2px solid var(--gold-deep);
    border-radius:4px;padding:9px 18px;cursor:pointer;font-size:.82rem;white-space:nowrap;transition:background .2s,transform .1s}
  .playbtn:hover{background:#5d3052}.playbtn:active{transform:translateY(1px)}
  .playbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .yeardisp{font-family:'Cinzel',serif;font-weight:700;color:var(--purple-deep);font-size:1.05rem;
    min-width:108px;text-align:center;background:rgba(255,255,255,.35);border-radius:4px;padding:4px 8px}
  .slider-wrap{flex:1;min-width:190px;display:flex;align-items:center}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--purple-deep) 0%,var(--purple-deep) var(--fill,0%),#bfa676 var(--fill,0%));cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--gold);border:2px solid var(--purple-deep);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--gold);border:2px solid var(--purple-deep);cursor:pointer}
  input[type=range]:focus-visible{outline:3px solid var(--purple-deep);outline-offset:4px}
  .legend{font-size:.77rem;color:var(--ink-soft);margin-top:9px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:13px;height:13px;border-radius:3px;display:inline-block}
  footer{margin-top:12px;text-align:center;color:#9c8a66;font-size:.7rem;font-style:italic}
  @media (max-width:560px){.yeardisp{min-width:92px;font-size:.92rem}.slider-wrap{order:3;flex:1 1 100%}.pop{width:74vw}}
  @media (prefers-reduced-motion:reduce){.battle.on .pulse{animation:none}}
</style>
</head>

<script>
(function(){
  "use strict";
  const NS="http://www.w3.org/2000/svg";
  const stops=[{"name": "Pela", "x": 72.9, "y": 112.7, "type": "city"}, {"name": "Gránico", "x": 148.1, "y": 120.5, "type": "battle", "year": 334, "foe": "Sátrapas persas", "force": "~35.000 macedonios", "result": "Victoria · entrada a Asia Menor"}, {"name": "Iso", "x": 293.5, "y": 166.0, "type": "battle", "year": 333, "foe": "Darío III", "force": "~40.000 vs ~100.000", "result": "Victoria · huida de Darío"}, {"name": "Tiro", "x": 277.4, "y": 214.8, "type": "city"}, {"name": "Alejandría", "x": 192.3, "y": 243.1, "type": "city"}, {"name": "Gaugamela", "x": 408.1, "y": 172.6, "type": "battle", "year": 331, "foe": "Darío III", "force": "~47.000 vs ~250.000", "result": "Victoria decisiva · cae el Imperio Persa"}, {"name": "Babilonia", "x": 426.1, "y": 224.8, "type": "city"}, {"name": "Persépolis", "x": 562.7, "y": 260.3, "type": "city"}, {"name": "Bactra", "x": 788.7, "y": 167.2, "type": "city"}, {"name": "Hidaspes", "x": 898.4, "y": 230.8, "type": "battle", "year": 326, "foe": "Rey Poros", "force": "~40.000 · elefantes de guerra", "result": "Victoria · límite oriental"}];
  const Y_MIN=334,Y_MAX=323;
  const route=document.getElementById('route'),routeCore=document.getElementById('routeCore'),
    runner=document.getElementById('runner'),battlesG=document.getElementById('battles'),
    citiesG=document.getElementById('cities'),empireRect=document.getElementById('empireRect'),
    slider=document.getElementById('slider'),yearDisp=document.getElementById('yearDisp'),
    playBtn=document.getElementById('play'),pop=document.getElementById('pop'),svg=document.getElementById('svg');

  function smooth(pts){if(pts.length<2)return"";let d="M"+pts[0].x+","+pts[0].y;
    for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
      d+=" C"+c1x+","+c1y+" "+c2x+","+c2y+" "+p2.x+","+p2.y;}return d;}
  const fullPath=smooth(stops);
  route.setAttribute('d',fullPath);routeCore.setAttribute('d',fullPath);
  const LEN=route.getTotalLength();
  route.style.strokeDasharray=LEN;route.style.strokeDashoffset=LEN;
  routeCore.style.strokeDasharray=LEN;routeCore.style.strokeDashoffset=LEN;

  function star(cx,cy,R,r,n){let p="";for(let i=0;i<n*2;i++){const a=Math.PI/n*i-Math.PI/2,rad=i%2?r:R;
    p+=(i?"L":"M")+(cx+Math.cos(a)*rad).toFixed(1)+","+(cy+Math.sin(a)*rad).toFixed(1);}return p+"Z";}

  stops.forEach((s,i)=>{
    if(s.type==="battle"){
      const g=document.createElementNS(NS,'g');g.setAttribute('class','battle');
      g.setAttribute('tabindex','0');g.setAttribute('role','button');
      g.setAttribute('aria-label','Batalla de '+s.name+', '+s.year+' a.C.');g.dataset.i=i;
      g.innerHTML='<circle class="pulse" cx="'+s.x+'" cy="'+s.y+'" r="4"/>'+
        '<path class="star" d="'+star(s.x,s.y,8,3.3,8)+'"/>'+
        '<text class="lab" x="'+s.x+'" y="'+(s.y-12)+'" font-size="9">'+s.name.toUpperCase()+
        ' <tspan class="yr" font-size="7.5">'+s.year+'</tspan></text>';
      battlesG.appendChild(g);
      const open=e=>{e&&e.stopPropagation();showPop(s,g);};
      g.addEventListener('click',open);
      g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
    }else{
      const g=document.createElementNS(NS,'g');g.setAttribute('class','city');g.dataset.i=i;
      g.innerHTML='<circle cx="'+s.x+'" cy="'+s.y+'" r="2.2"/>'+
        '<text x="'+s.x+'" y="'+(s.y-5)+'" font-size="8">'+s.name+'</text>';
      citiesG.appendChild(g);
    }
  });

  function render(p){
    const year=Math.round(Y_MIN-(Y_MIN-Y_MAX)*(p/100));
    yearDisp.textContent=year+" a.C.";slider.style.setProperty('--fill',p+'%');
    const frac=p/100;
    route.style.strokeDashoffset=LEN*(1-frac);routeCore.style.strokeDashoffset=LEN*(1-frac);
    const pt=route.getPointAtLength(LEN*frac);
    runner.setAttribute('cx',pt.x);runner.setAttribute('cy',pt.y);
    runner.classList.toggle('on',p>0&&p<100);
    let reachX=stops[0].x;const idxF=frac*(stops.length-1),reached=Math.floor(idxF+1e-4);
    for(let i=0;i<=Math.min(reached,stops.length-1);i++)reachX=Math.max(reachX,stops[i].x);
    if(reached<stops.length-1){const t=idxF-reached;
      reachX=Math.max(reachX,stops[reached].x+(stops[reached+1].x-stops[reached].x)*t);}
    empireRect.setAttribute('width',Math.min(1000,reachX+40));
    document.querySelectorAll('.battle,.city').forEach(m=>{
      const sp=(+m.dataset.i)/(stops.length-1);m.classList.toggle('on',frac>=sp-0.001);});
  }
  slider.addEventListener('input',e=>{stopPlay();render(+e.target.value);});

  let playing=false,raf=null,t0=0;const DUR=8000;
  function tick(ts){if(!t0)t0=ts;const p=Math.min(100,(ts-t0)/DUR*100);
    slider.value=p;render(p);if(p<100)raf=requestAnimationFrame(tick);else stopPlay(true);}
  function startPlay(){if(+slider.value>=100){slider.value=0;render(0);}playing=true;t0=0;
    playBtn.textContent='❚❚ Pausar';raf=requestAnimationFrame(tick);}
  function stopPlay(done){playing=false;if(raf)cancelAnimationFrame(raf);raf=null;
    playBtn.textContent=done?'↻ Repetir campaña':'▶ Reproducir campaña';}
  playBtn.addEventListener('click',()=>{playing?stopPlay():startPlay();});

  function showPop(s,g){
    document.getElementById('popName').textContent=s.name;
    document.getElementById('popYear').textContent=s.year+" A.C.";
    document.getElementById('popFoe').textContent=s.foe;
    document.getElementById('popForce').textContent=s.force;
    document.getElementById('popResult').textContent=s.result;
    pop.classList.add('show');
    const inner=document.getElementById('mapInner'),ir=inner.getBoundingClientRect(),br=g.getBoundingClientRect();
    const pw=pop.offsetWidth,ph=pop.offsetHeight;
    let left=br.left-ir.left+br.width/2-pw/2,top=br.top-ir.top-ph-8;
    if(top<6)top=br.bottom-ir.top+8;left=Math.max(6,Math.min(left,ir.width-pw-6));
    pop.style.left=left+'px';pop.style.top=top+'px';
  }
  function hidePop(){pop.classList.remove('show');}
  document.getElementById('popClose').addEventListener('click',e=>{e.stopPropagation();hidePop();});
  svg.addEventListener('click',e=>{if(!e.target.closest('.battle'))hidePop();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePop();});
  render(0);
})();
</script>
